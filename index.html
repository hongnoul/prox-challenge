<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A scale-anchored abstract model of the Vulcan OmniPro 220 welder."
    />
    <title>OmniPro 220 · Form study</title>
  </head>
  <body>
    <main>
      <div id="scene" aria-label="Interactive 3D model of a Vulcan OmniPro 220 welder"></div>

      <header class="title-block">
        <p class="kicker">Vulcan OmniPro 220</p>
        <h1>Front panel</h1>
        <p class="note">Instructional front panel traced to Owner’s Manual page 8.</p>
      </header>

      <section class="specs" aria-label="Model dimensions">
        <div><span>W</span><strong>12″</strong></div>
        <div><span>H</span><strong>17″</strong></div>
        <div><span>L</span><strong>21″</strong></div>
      </section>

      <div class="controls" aria-label="Viewer controls">
        <button id="front-view" type="button">Front view</button>
        <button id="reset-view" type="button">Reset view</button>
        <label>
          <input id="reference" type="checkbox" />
          <span>Reference</span>
        </label>
      </div>

      <aside class="part-inspector" aria-live="polite">
        <span class="part-inspector__status">Source-backed component</span>
        <strong id="part-name">Select a control</strong>
        <span id="part-source">Owner’s Manual page 8</span>
      </aside>

      <figure class="reference-view" hidden>
        <img src="/product.webp" alt="Official OmniPro 220 exterior reference" />
        <figcaption>Official exterior reference</figcaption>
      </figure>

      <p class="orbit-hint">Drag to orbit · Select a control</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
