<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A scale-anchored abstract model of the Vulcan OmniPro 220 welder."
    />
    <title>OmniPro 220 · Form study</title>
  </head>
  <body>
    <main>
      <div id="scene" aria-label="Interactive 3D model of a Vulcan OmniPro 220 welder"></div>

      <header class="title-block">
        <p class="kicker">Vulcan OmniPro 220</p>
        <h1>Form study</h1>
        <p class="note">Scale anchored. Details estimated from reference photos.</p>
      </header>

      <section class="specs" aria-label="Model dimensions">
        <div><span>W</span><strong>12″</strong></div>
        <div><span>H</span><strong>17″</strong></div>
        <div><span>L</span><strong>21″</strong></div>
      </section>

      <div class="controls" aria-label="Viewer controls">
        <button id="reset-view" type="button">Reset view</button>
        <label>
          <input id="wireframe" type="checkbox" />
          <span>Wireframe</span>
        </label>
      </div>

      <p class="orbit-hint">Drag to orbit · Scroll to zoom</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
